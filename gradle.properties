# ⚠️ 这里**不能**加 -Dfile.encoding=UTF-8。
#
# Gradle 把测试进程的 classpath 写进一个 @argfile，用的就是守护进程的
# file.encoding；而 JDK 17 读 @argfile 用的是系统默认编码（中文 Windows = GBK）。
# 一旦写成 UTF-8，工程路径里的「小工具」三个字会被读成乱码，
# 整个 classpath 失效 —— 单元测试全部报 ClassNotFoundException，
# 而类文件其实是好的（1.4.6 踩过，查了很久）。
# 源码本身的读写不受影响：Kotlin 固定按 UTF-8 读源文件，javac 由 AGP 按 UTF-8 传参。
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# 工程路径下若含中文（例如 D:\项目\xxx），Windows 上的 AGP 会直接拒绝构建。
# 这一行是官方提供的绕过开关。含非 ASCII 路径时 ndk / aapt2 仍可能出问题，
# 长期建议把工程放在纯英文路径下（例如 D:\code\qushe-android）。
android.overridePathCheck=true

kotlin.code.style=official
