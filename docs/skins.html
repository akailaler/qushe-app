<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>取舍 · 十套配色</title>
<style>
  :root {
    --paper: #f1efea;
    --ink: #211f1c;
    --ink-2: #5f5b54;
    --ink-3: #928d84;
    --line: #dcd6cd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1080px; margin: 0 auto; padding: 72px 28px 120px; }

  header { border-bottom: 1px solid var(--line); padding-bottom: 30px; margin-bottom: 44px; }
  .kicker {
    font-size: 11px; letter-spacing: .34em; color: var(--ink-3);
    text-transform: uppercase; margin: 0 0 22px;
  }
  h1 {
    font-family: "Songti SC", "Source Han Serif SC", "Noto Serif SC", "SimSun", serif;
    font-weight: 500; font-size: 46px; line-height: 1.18; margin: 0 0 18px;
    letter-spacing: .06em;
  }
  .lede { margin: 0; max-width: 46em; font-size: 14px; line-height: 2; color: var(--ink-2); }
  .lede b { font-weight: 500; color: var(--ink); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 34px 30px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 34px; } }

  .skin { border-top: 1px solid var(--line); padding-top: 18px; }
  .skin-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .skin-name {
    font-family: "Songti SC", "Source Han Serif SC", "Noto Serif SC", serif;
    font-size: 21px; letter-spacing: .16em; margin: 0; font-weight: 500;
  }
  .skin-src { font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }

  .swatches { display: flex; gap: 3px; margin: 14px 0 16px; }
  .swatches i { display: block; height: 9px; flex: 1; }
  .swatches i:first-child { flex: 2.6; }
  .swatches i:last-child { flex: 1.8; }

  .screens { display: flex; gap: 10px; }
  .screen {
    flex: 1; min-width: 0; border-radius: 13px; overflow: hidden;
    padding: 15px 13px 0; display: flex; flex-direction: column;
  }
  .s-title { font-size: 15px; letter-spacing: .08em; font-weight: 600; }
  .s-sub { font-size: 8px; margin-top: 3px; line-height: 1.5; }
  .s-cards { margin-top: 13px; display: flex; flex-direction: column; gap: 6px; }
  .s-card {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 8px 8px 0; border-radius: 7px; position: relative;
  }
  .s-bar { width: 2.5px; align-self: stretch; border-radius: 2px; margin-left: 7px; }
  .s-text { flex: 1; min-width: 0; }
  .s-text b { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: .02em; }
  .s-text span { display: block; font-size: 7px; margin-top: 2px; opacity: .72; }
  .s-num { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; padding-right: 4px; }
  .s-stats {
    margin-top: 13px; display: flex; justify-content: space-between;
    padding: 9px 10px; border-radius: 8px;
  }
  .s-stats div { text-align: center; }
  .s-stats b { display: block; font-size: 9.5px; font-variant-numeric: tabular-nums; }
  .s-stats span { display: block; font-size: 6px; margin-top: 3px; opacity: .6; }
  .s-nav { margin-top: auto; display: flex; padding: 10px 6px 9px; }
  .s-nav div { flex: 1; text-align: center; font-size: 7px; line-height: 1.4; }
  .s-nav i { display: block; font-size: 10px; font-style: normal; margin-bottom: 2px; }

  footer { margin-top: 64px; border-top: 1px solid var(--line); padding-top: 20px;
           font-size: 11px; color: var(--ink-3); line-height: 1.9; }
  code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 10px; }
</style>
</head>
<body>
<div class="page">
  <header>
    <p class="kicker">取舍 · Qushe</p>
    <h1>十种光线</h1>
    <p class="lede">
      每一套都是<strong>同一张界面</strong>换一层光：底色定温度，卡片比底色亮一档，
      主色只出现在选中的字、星形和左侧那道细条上。<b>右边是深色版</b>，它不是"把浅色反过来"，
      而是重新配的 —— 深色底永远带一点色相，纯黑会把照片衬得发脏。
    </p>
  </header>
  <div class="grid" id="grid"></div>
  <footer>
    色值真源：<code>app/src/main/java/com/qushe/app/ui/theme/Theme.kt</code> ·
    对比度按 WCAG 2.1 计算值核对（正文 ≥ 10、次要 ≥ 4.6、主色 ≥ 4.5）。
  </footer>
</div>
<script>
const SKINS = [
  { n: "素白玄墨", s: "默认 · 中性黑白", l: ["F5F5F7","FFFFFF","0B8062","D8324F","2C6FD1","6259BE","A56D1B","17171B","5C5C66","888892"],
                                     d: ["0B0B0D","16161A","35D0A5","FF5C7A","6BA8FF","AFA9EC","F0B65C","F2F2F5","9A9AA5","63636E"] },
  { n: "暖桃初雪", s: "暖桃 · 一点初雪的白", l: ["FFF9F4","FFF6EF","9C6454","A9675C","537FAA","8E7AB2","9F723A","4A3B36","7E6C65","988983"],
                                     d: ["1F1D24","2B2831","A8867C","B47A73","7D97B8","9A8CB8","B08A55","E4E0E2","A89CA0","736C74"] },
  { n: "新茶初雨", s: "奶绿 · 雨后的新叶", l: ["F4F9F4","FAFCFA","54796A","A7655E","5B7E98","887BA5","967543","2F3A35","66726C","838D88"],
                                     d: ["1D2424","262E2D","86A79B","B5837D","7C97A8","9488AE","AE8B5B","E1E7E4","A0ABA6","6B7671"] },
  { n: "燕麦秋声", s: "燕麦 · 干草与木", l: ["F7F3ED","FBF8F3","7E6B59","9E665E","657A8C","897899","927147","3A352E","736B62","8F877E"],
                                     d: ["222120","2C2B29","A79C90","AE7D76","8595A3","9C90A8","AE8A5E","E6E2DC","A8A199","736C64"] },
  { n: "远山如黛", s: "雾蓝 · 远山的青", l: ["F3F6F9","FAFCFE","567389","A26660","4D7CAC","7A7CB0","927447","2C353D","626E78","808992"],
                                     d: ["191D22","232830","8FAEC6","AF7C77","7EA3C9","9A9CC8","A98A5F","DFE5EA","9DA9B4","6A757E"] },
  { n: "烟粉旧梦", s: "莫兰迪 · 灰玫瑰", l: ["F8F3F2","FCF8F7","90646C","A4635E","667A8F","8A7A93","93724E","3D3335","75686B","8E8185"],
                                     d: ["1E1A1C","2A2427","C39AA0","C08A85","93A7BC","A99BB3","B99B72","E9E2E3","B0A3A5","7C7174"] },
  { n: "睡莲静水", s: "莫奈 · 睡莲池", l: ["F0F4F2","F7FAF8","517670","9E6465","547B9E","797AA6","8C744C","2B3634","61706D","7C8A87"],
                                     d: ["17201F","202A29","8FB5AC","BB8481","8AAAC9","A3A2C6","B39A6E","DEE8E5","A2B0AD","6E7C79"] },
  { n: "赤陶晚照", s: "塞尚 · 赭石山丘", l: ["F8F1E9","FCF7F0","946245","9E5B52","637A8B","89788F","966F38","3B3028","746558","8E7F71"],
                                     d: ["201B17","2B2520","C9946F","C08579","93A9B8","A79AB0","C09052","EBE2D8","B3A697","7E7365"] },
  { n: "椰影暖沙", s: "高更 · 塔希提日光", l: ["FAF4E8","FDF9F0","826D3C","A2654E","5A7E89","8B7A96","9A6F3F","38301F","73684F","8E8368"],
                                     d: ["1E1C15","292720","C4AF74","C0876E","85A8AF","A69AB0","C29157","EAE4D3","B2A98F","7C7461"] },
  { n: "青苔石阶", s: "苔庭 · 湿石与青苔", l: ["F5F6F0","FAFBF6","5C7052","9A6058","647C8B","887B98","927345","2F342A","6A7161","848B7B"],
                                     d: ["1B1F19","242A23","9FB594","C08A80","90A9B6","ABA0B8","BC9664","E5E9DD","A9B0A0","727A6C"] }
];

// [0]底 [1]卡 [2]主 [3]删 [4]信息 [5]紫 [6]文件 [7]正文 [8]次要 [9]提示
function phone(c) {
  const [bg, sf, main, del, info, purple, folder, tp, ts, tt] = c.map(x => "#" + x);
  const cards = [
    ["整理照片", "上滑删除 · 左右翻页", "115777", main],
    ["整理截屏", "单独成组 · 一眼废片", "6296", purple],
    ["整理视频", "上下滑切换 · 长按 2×", "8655", info],
  ].map(([t, sub, num, ac]) => `
    <div class="s-card" style="background:${sf}">
      <div class="s-bar" style="background:${ac}"></div>
      <div class="s-text"><b style="color:${tp}">${t}</b><span style="color:${ts}">${sub}</span></div>
      <div class="s-num" style="color:${ac}">${num}</div>
    </div>`).join("");

  return `
  <div class="screen" style="background:${bg}">
    <div class="s-title" style="color:${tp}">取舍</div>
    <div class="s-sub" style="color:${tt}">像刷短视频一样刷自己的相册</div>
    <div class="s-cards">${cards}</div>
    <div class="s-stats" style="background:${sf}">
      <div><b style="color:${tp}">2862</b><span style="color:${tt}">看过照片</span></div>
      <div><b style="color:${tp}">282</b><span style="color:${tt}">看过视频</span></div>
      <div><b style="color:${del}">1919</b><span style="color:${tt}">已删除</span></div>
      <div><b style="color:${main}">336</b><span style="color:${tt}">已收藏</span></div>
    </div>
    <div class="s-nav" style="background:${sf}">
      <div style="color:${main}"><i>▣</i>首页</div>
      <div style="color:${tt}"><i>★</i>收藏</div>
      <div style="color:${tt}"><i>▤</i>回收站</div>
      <div style="color:${tt}"><i>⚙</i>设置</div>
    </div>
  </div>`;
}

document.getElementById("grid").innerHTML = SKINS.map(k => {
  const sw = [k.l[0], k.l[1], k.l[2], k.l[3], k.l[7]].map(x => `<i style="background:#${x}"></i>`).join("");
  return `
  <article class="skin">
    <div class="skin-head"><h2 class="skin-name">${k.n}</h2><span class="skin-src">${k.s}</span></div>
    <div class="swatches">${sw}</div>
    <div class="screens">${phone(k.l)}${phone(k.d)}</div>
  </article>`;
}).join("");
</script>
</body>
</html>
